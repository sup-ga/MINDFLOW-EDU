name: Validate MindFlow professional offers

on:
  push:
    branches:
      - feature/professional-offers-rebuild
      - main
  pull_request:
    branches:
      - main

jobs:
  browser-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript on offer and payment pages
        run: node scripts/check-professional-offer-pages.mjs

  payment-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check order creation
        run: deno check supabase/functions/create-mindflow-order/index.ts
      - name: Type-check E-Billing payment
        run: deno check supabase/functions/create-ebilling-payment/index.ts
      - name: Type-check payment callback
        run: deno check supabase/functions/ebilling-callback/index.ts
