<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c"><title>Accès gratuit — MindFlow</title>
<style>
:root{color-scheme:dark;--bg:#10131c;--panel:#191e2b;--text:#f7f7fb;--muted:#b4bacb;--mint:#a9f4d0;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#51457a44,transparent 35%),var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif}.wrap{width:min(520px,calc(100% - 32px));margin:0 auto;padding:34px 0 60px}a{color:inherit;text-decoration:none}.brand{font-size:1.2rem;font-weight:850}.brand span{color:var(--mint)}.card{margin-top:42px;padding:clamp(22px,5vw,36px);border:1px solid var(--line);border-radius:24px;background:#191e2bdd}.eyebrow{color:var(--mint);font-size:.75rem;text-transform:uppercase;letter-spacing:.16em;font-weight:800}h1{font-size:clamp(2rem,7vw,3rem);line-height:1.05;letter-spacing:-.06em;margin:12px 0}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button,.btn{border:0;border-radius:999px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}.tabs button{flex:1;background:#ffffff0b;color:var(--muted)}.tabs button.active,.btn{background:var(--mint);color:#15251e}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:.85rem;font-weight:750}.field input{width:100%;border:1px solid #ffffff26;background:#111824;color:var(--text);border-radius:12px;padding:13px 14px;font:inherit;min-height:48px}.btn{width:100%;margin-top:12px}.btn:disabled{opacity:.55;cursor:wait}.msg{display:none;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);overflow-wrap:anywhere}.msg.show{display:block}.msg.error{border-color:#ff9aa866;color:#ffc0c9}.msg.success{border-color:#9ef2d370;color:var(--mint)}#signupFields{display:none}footer{margin-top:24px;font-size:.85rem;color:var(--muted)}</style></head>
<body><main class="wrap"><a class="brand" href="index.html">Mind<span>Flow</span></a><section class="card"><div class="eyebrow">Accès 100 % gratuit</div><h1 id="heading">Obtiens ta ressource.</h1><p id="product" class="muted">Vérification de la ressource…</p><p class="muted">Connecte-toi ou crée un compte. Une fois connecté, le téléchargement du PDF se lancera automatiquement. Aucun paiement ne sera demandé.</p>
<div class="tabs"><button id="loginTab" class="active" type="button">Connexion</button><button id="signupTab" type="button">Créer un compte</button></div>
<form id="authForm"><div id="signupFields"><div class="field"><label for="name">Nom complet</label><input id="name" autocomplete="name" maxlength="100"></div></div><div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div><button id="submit" class="btn" type="submit">Se connecter et télécharger</button></form><div id="message" class="msg" role="status" aria-live="polite"></div></section><footer><a href="catalogue.html">← Retour au catalogue</a> · MindFlow</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const KEY="sb_publishable_JAtY5AemjObNRI86NMGtlA__c_8tLil",URL="https://vzgmhdxxlgdiimqtincf.supabase.co",DOWNLOAD=URL+"/functions/v1/mindflow-free-download";
const supa=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s);const productId=new URLSearchParams(location.search).get("id");let mode="login",product=null,busy=false;
function say(text,type=""){const el=$("#message");el.textContent=text;el.className="msg show "+type}
function setMode(next){mode=next;$("#loginTab").classList.toggle("active",mode==="login");$("#signupTab").classList.toggle("active",mode==="signup");$("#signupFields").style.display=mode==="signup"?"block":"none";$("#name").required=mode==="signup";$("#submit").textContent=mode==="signup"?"Créer mon compte et télécharger":"Se connecter et télécharger";$("#password").autocomplete=mode==="signup"?"new-password":"current-password";$("#message").className="msg"}
$("#loginTab").addEventListener("click",()=>setMode("login"));$("#signupTab").addEventListener("click",()=>setMode("signup"));
async function download(session){if(busy)return;busy=true;$("#submit").disabled=true;$("#submit").textContent="Préparation du téléchargement…";say("Compte vérifié. Préparation du PDF…");try{const res=await fetch(DOWNLOAD,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify({product_id:productId})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success||!data.download_url)throw Error(data.error||"Le téléchargement n’a pas pu démarrer.");say("Ton téléchargement commence…","success");const a=document.createElement("a");a.href=data.download_url;a.download=data.file_name||"ressource.pdf";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();$("#submit").textContent="Téléchargement lancé";}catch(e){say(e.message||"Impossible de lancer le téléchargement.","error");$("#submit").disabled=false;$("#submit").textContent="Réessayer le téléchargement";busy=false}}
async function init(){if(!productId){say("Aucune ressource sélectionnée. Retourne au catalogue.","error");return}try{const r=await fetch(URL+"/functions/v1/mindflow-public-catalog?product_id="+encodeURIComponent(productId),{headers:{apikey:KEY}});const d=await r.json();product=d.products?.[0];if(!r.ok||!product)throw Error(d.error||"Ressource introuvable.");if(!product.is_free){location.replace("paiement.html?id="+encodeURIComponent(productId));return}$("#product").textContent=product.title+" · Gratuit · 0 FCFA";document.title=product.title+" — Accès gratuit MindFlow";const {data:{session}}=await supa.auth.getSession();if(session?.user)await download(session);else if(new URLSearchParams(location.search).get("mode")==="signup")setMode("signup")}catch(e){say(e.message||"Impossible de vérifier cette ressource.","error")}}
$("#authForm").addEventListener("submit",async e=>{e.preventDefault();if(busy)return;const btn=$("#submit");btn.disabled=true;try{const email=$("#email").value.trim().toLowerCase(),password=$("#password").value;if(mode==="signup"){const full_name=$("#name").value.trim();if(!full_name)throw Error("Indique ton nom complet.");const {data,error}=await supa.auth.signUp({email,password,options:{data:{full_name},emailRedirectTo:location.href}});if(error)throw error;if(data.session){await download(data.session)}else{say("Compte créé. Vérifie ta boîte e-mail pour confirmer ton adresse. Ouvre le lien de confirmation sur cet appareil : le téléchargement pourra alors démarrer.","success");btn.textContent="En attente de confirmation";}}else{const {data,error}=await supa.auth.signInWithPassword({email,password});if(error)throw error;await download(data.session)}}catch(e){say(e.message||"Connexion impossible. Réessaie.","error");btn.disabled=false}finally{if(!busy&&btn.textContent!=="En attente de confirmation")btn.disabled=false}});
supa.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_IN"&&session?.user&&!busy)await download(session)});
init();
</script></body></html>
