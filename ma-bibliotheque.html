<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c"><title>Ma bibliothèque — MindFlow</title>
<style>
:root{color-scheme:dark;--bg:#10131c;--text:#f7f7fb;--muted:#b4bacb;--mint:#a9f4d0;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#51457a44,transparent 35%),var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--line)}.nav{display:flex;justify-content:space-between}.brand{font-weight:850}.brand span{color:var(--mint)}.hero{padding:56px 0 24px}.eyebrow{color:var(--mint);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(2.4rem,5vw,4rem);letter-spacing:-.06em;margin:10px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:24px 0 70px}.book{min-width:0}.cover{aspect-ratio:3/4;border-radius:20px 20px 55px 20px;overflow:hidden;background:linear-gradient(145deg,#293e49,#4d3d68 65%,#81576d);display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover}.cover span{font-size:3rem;color:var(--mint)}h2{font-size:1.08rem;line-height:1.2;margin:12px 0 4px}.author{font-size:.88rem;color:var(--muted)}button{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--text);background:#ffffff0a;cursor:pointer;margin:10px 6px 0 0}.state{grid-column:1/-1;padding:50px 10px;text-align:center;color:var(--muted)}.reader{width:min(1050px,94vw);height:min(88vh,900px);border:1px solid var(--line);border-radius:20px;background:#111521;padding:0;max-width:none;max-height:none}.reader::backdrop{background:#05070bdc}.bar{display:flex;justify-content:space-between;padding:12px 16px}.body{height:calc(100% - 55px);background:#fff}.body iframe{width:100%;height:100%;border:0}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html">Mind<span>Flow</span></a><a href="bibliotheque.html">Explorer la bibliothèque ↗</a></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">Ton espace de lecture</div><h1>Ma bibliothèque.</h1><p class="muted">Retrouve ici les œuvres gratuites, achetées ou ajoutées à ton compte.</p></section><div id="state" class="muted">Chargement de tes livres…</div><section class="grid" id="books"></section></main>
<dialog class="reader" id="reader"><div class="bar"><strong id="readerTitle">Lecture MindFlow</strong><button id="close">Fermer ✕</button></div><div class="body" id="readerBody"></div></dialog>
<dialog class="reader" id="guideDialog"><div class="bar"><strong id="guideHeading">Fiches pédagogiques</strong><button id="guideClose">Fermer ✕</button></div><div class="body" style="background:#111521;color:#f7f7fb;overflow:auto;padding:22px" id="guideBody"></div></dialog>\n<dialog class="reader" id="quizDialog"><div class="bar"><strong id="quizHeading">Quiz de lecture</strong><button id="quizClose">Fermer ✕</button></div><div class="body" style="background:#111521;color:#f7f7fb;overflow:auto;padding:22px" id="quizBody"></div></dialog>\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const KEY="sb_publishable_JAtY5AemjObNRI86NMGtlA__c_8tLil",URL="https://vzgmhdxxlgdiimqtincf.supabase.co",API=URL+"/functions/v1/mindflow-library";
const supa=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function learnerApi(payload){const {data:{session}}=await supa.auth.getSession();if(!session?.user){location.href="espace-apprenant.html?mode=login";return null}const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Opération impossible.");return d}

async function openGuides(bookId,title){try{const d=await learnerApi({action:"guide_list",book_id:bookId});if(!d)return;$("#guideHeading").textContent="Fiches · "+title;const guides=d.guides||[];$("#guideBody").innerHTML=guides.length?guides.map(g=>'<article style="border:1px solid #ffffff20;border-radius:14px;padding:16px;margin-bottom:14px"><p class="eyebrow">'+esc(({reading_sheet:"Fiche de lecture",summary:"Résumé",analysis:"Analyse littéraire",vocabulary:"Vocabulaire",exercise:"Exercices",context:"Contexte"})[g.guide_type]||g.guide_type)+'</p><h2>'+esc(g.title)+'</h2><pre style="white-space:pre-wrap;font:inherit;color:#e7e9f1">'+esc(g.content_markdown)+'</pre></article>').join(""):'<p class="muted">Aucune fiche pédagogique publiée pour cet ouvrage.</p>';$("#guideDialog").showModal()}catch(e){alert(e.message)}}

async function saveProgress(id,percent,location={}){try{await learnerApi({action:"progress_save",book_id:id,progress_percent:percent,current_location:location})}catch(e){console.warn("Progression de lecture",e.message)}}
async function openQuizzes(bookId,title){
 try{const d=await learnerApi({action:"quiz_list",book_id:bookId});if(!d)return;const quizzes=d.quizzes||[];$("#quizHeading").textContent="Quiz · "+title;$("#quizBody").innerHTML=quizzes.length?quizzes.map(q=>'<article class="item" style="padding:16px;border:1px solid #ffffff20;border-radius:14px;margin-bottom:12px"><strong>'+esc(q.title)+'</strong><p class="muted">'+esc(q.description||"Vérifie ta compréhension de cet ouvrage.")+'</p><p class="muted">Réussite : '+Number(q.passing_score)+' %</p><button type="button" data-start-quiz="'+esc(q.id)+'">Commencer</button></article>').join(""):'<p class="muted">Aucun quiz publié pour cet ouvrage pour le moment.</p>';$("#quizBody").querySelectorAll("[data-start-quiz]").forEach(b=>b.addEventListener("click",()=>runQuiz(b.dataset.startQuiz)));$("#quizDialog").showModal()}catch(e){alert(e.message)}}
async function runQuiz(quizId){
 try{const d=await learnerApi({action:"quiz_get",quiz_id:quizId});if(!d)return;const q=d.quiz;$("#quizHeading").textContent=q.title;$("#quizBody").innerHTML='<p class="muted">'+esc(q.description||"Réponds aux questions puis valide tes réponses.")+'</p><form id="quizAnswerForm">'+q.questions.map((x,i)=>'<fieldset style="border:1px solid #ffffff24;border-radius:14px;padding:14px;margin:14px 0"><legend><b>'+(i+1)+'. '+esc(x.question_text)+'</b></legend>'+(x.question_type==="short_answer"?'<input name="'+esc(x.id)+'" type="text" style="width:100%;padding:12px;border-radius:9px;background:#ffffff10;color:white;border:1px solid #ffffff30" placeholder="Ta réponse">':x.answers.map(a=>'<label style="display:flex;gap:10px;align-items:center;padding:8px 0"><input type="'+(x.question_type==="multiple_choice"?"checkbox":"radio")+'" name="'+esc(x.id)+'" value="'+esc(a.id)+'"> '+esc(a.answer_text)+'</label>').join(""))+'</fieldset>').join("")+'<button type="submit">Valider mes réponses</button></form>';
 $("#quizAnswerForm").addEventListener("submit",async e=>{e.preventDefault();const answers={};for(const x of q.questions){const els=[...e.currentTarget.querySelectorAll('[name="'+CSS.escape(x.id)+'"]')];answers[x.id]=x.question_type==="multiple_choice"?els.filter(v=>v.checked).map(v=>v.value):x.question_type==="short_answer"?(els[0]?.value||""):(els.find(v=>v.checked)?.value||"")}const submit=e.currentTarget.querySelector('button[type="submit"]');submit.disabled=true;try{const result=await learnerApi({action:"quiz_submit",quiz_id:quizId,answers});if(!result)return;$("#quizBody").innerHTML='<div style="text-align:center;padding:24px"><div style="font-size:3rem">'+(result.passed?"🎉":"📚")+'</div><h2>'+result.score+' %</h2><p>'+(result.passed?"Bravo, tu as réussi ce quiz !":"Continue tes lectures et réessaie.")+'</p><p class="muted">'+result.correct+' bonne(s) réponse(s) sur '+result.total+' · Seuil : '+result.passing_score+' %</p></div>'+result.results.map((r,i)=>'<article style="padding:10px;border-bottom:1px solid #ffffff20"><b>'+(i+1)+'. '+(r.correct?"Bonne réponse":"À revoir")+'</b>'+(r.explanation?'<p class="muted">'+esc(r.explanation)+'</p>':"")+'</article>').join("")+'<button id="quizBack">Voir les autres quiz</button>';$("#quizBack").onclick=()=>openQuizzesForSameBook()}catch(err){alert(err.message);submit.disabled=false}});
 }catch(e){alert(e.message)}
}
let currentQuizBook=null,currentQuizTitle="";
async function openQuizzesForSameBook(){if(currentQuizBook)await openQuizzes(currentQuizBook,currentQuizTitle)}

async function fileFor(id,action){const {data:{session}}=await supa.auth.getSession();if(!session?.user){location.href="espace-apprenant.html?mode=login";return null}const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify({action,book_id:id})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Accès indisponible.");return d}
async function read(id){try{const d=await fileFor(id,"open");if(!d)return;await saveProgress(id,0,{mode:d.file_kind,started_at:new Date().toISOString()});$("#readerTitle").textContent=d.file_name||"Lecture MindFlow";$("#readerBody").innerHTML="";$("#reader").showModal();if(d.file_kind==="pdf"){const f=document.createElement("iframe");f.src=d.url;f.title=d.file_name;$("#readerBody").appendChild(f)}else{const holder=document.createElement("div");holder.style.cssText="height:100%;color:#111";$("#readerBody").appendChild(holder);if(!window.ePub)await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});const rendition=window.ePub(d.url).renderTo(holder,{width:"100%",height:"100%"});rendition.on("relocated",loc=>{const pct=Number(loc?.start?.percentage||0)*100;saveProgress(id,Math.min(99.9,Math.max(0,pct)),{href:loc?.start?.href||"",cfi:loc?.start?.cfi||""})});await rendition.display()}}catch(e){alert(e.message)}}
async function download(id){try{const d=await fileFor(id,"download");if(!d)return;const a=document.createElement("a");a.href=d.url;a.download=d.file_name||"livre";a.rel="noopener";a.click()}catch(e){alert(e.message)}}
async function load(){try{const {data:{session}}=await supa.auth.getSession();if(!session?.user){location.href="espace-apprenant.html?mode=login&next="+encodeURIComponent("ma-bibliotheque.html");return}const r=await fetch(API+"?mine=1",{headers:{apikey:KEY,Authorization:"Bearer "+session.access_token}}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Impossible de charger ta bibliothèque.");const books=d.books||[];$("#state").textContent=books.length?books.length+" livre"+(books.length>1?"s":"")+" dans ta bibliothèque":"Ta bibliothèque est encore vide.";$("#books").innerHTML=books.length?books.map(b=>'<article class="book"><div class="cover">'+(b.cover_url?'<img src="'+esc(b.cover_url)+'" alt="Couverture de '+esc(b.title)+'">':'<span>✳</span>')+'</div><h2>'+esc(b.title)+'</h2><p class="author">'+esc(b.author_name)+'</p>'+(b.reading_progress?'<p class="author">Progression : '+Number(b.reading_progress.progress_percent||0).toFixed(0)+' %</p>':'<p class="author">Pas encore commencé</p>')+'<button type="button" data-read="'+esc(b.id)+'">Lire</button><button type="button" data-download="'+esc(b.id)+'">Télécharger</button><button type="button" data-quiz="'+esc(b.id)+'" data-title="'+esc(b.title)+'">Quiz</button><button type="button" data-guides="'+esc(b.id)+'" data-title="'+esc(b.title)+'">Fiches</button></article>').join(""):"";$("#books").querySelectorAll("[data-read]").forEach(b=>b.addEventListener("click",()=>read(b.dataset.read)));$("#books").querySelectorAll("[data-download]").forEach(b=>b.addEventListener("click",()=>download(b.dataset.download)));$("#books").querySelectorAll("[data-quiz]").forEach(b=>b.addEventListener("click",()=>openQuizzes(b.dataset.quiz,b.dataset.title)));$("#books").querySelectorAll("[data-guides]").forEach(b=>b.addEventListener("click",()=>openGuides(b.dataset.guides,b.dataset.title)))}catch(e){$("#state").textContent=e.message}}
$("#close").addEventListener("click",()=>{$("#reader").close();$("#readerBody").innerHTML=""});$("#quizClose").addEventListener("click",()=>$("#quizDialog").close());$("#guideClose").addEventListener("click",()=>$("#guideDialog").close());load();
</script><script src="cookie-consent.js?v=20261026-1"></script><script src="guides-apprenant.js?v=20261030-1"></script></body></html>
