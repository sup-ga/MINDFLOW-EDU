<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c"><title>Ma bibliothèque — MindFlow</title>
<style>
:root{color-scheme:dark;--bg:#10131c;--text:#f7f7fb;--muted:#b4bacb;--mint:#a9f4d0;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#51457a44,transparent 35%),var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--line)}.nav{display:flex;justify-content:space-between}.brand{font-weight:850}.brand span{color:var(--mint)}.hero{padding:56px 0 24px}.eyebrow{color:var(--mint);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(2.4rem,5vw,4rem);letter-spacing:-.06em;margin:10px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:24px 0 70px}.book{min-width:0}.cover{aspect-ratio:3/4;border-radius:20px 20px 55px 20px;overflow:hidden;background:linear-gradient(145deg,#293e49,#4d3d68 65%,#81576d);display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover}.cover span{font-size:3rem;color:var(--mint)}h2{font-size:1.08rem;line-height:1.2;margin:12px 0 4px}.author{font-size:.88rem;color:var(--muted)}button{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--text);background:#ffffff0a;cursor:pointer;margin:10px 6px 0 0}.state{grid-column:1/-1;padding:50px 10px;text-align:center;color:var(--muted)}.reader{width:min(1050px,94vw);height:min(88vh,900px);border:1px solid var(--line);border-radius:20px;background:#111521;padding:0;max-width:none;max-height:none}.reader::backdrop{background:#05070bdc}.bar{display:flex;justify-content:space-between;padding:12px 16px}.body{height:calc(100% - 55px);background:#fff}.body iframe{width:100%;height:100%;border:0}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html">Mind<span>Flow</span></a><a href="bibliotheque.html">Explorer la bibliothèque ↗</a></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">Ton espace de lecture</div><h1>Ma bibliothèque.</h1><p class="muted">Retrouve ici les œuvres gratuites, achetées ou ajoutées à ton compte.</p></section><div id="state" class="muted">Chargement de tes livres…</div><section class="grid" id="books"></section></main>
<dialog class="reader" id="reader"><div class="bar"><strong id="readerTitle">Lecture MindFlow</strong><button id="close">Fermer ✕</button></div><div class="body" id="readerBody"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const KEY="sb_publishable_JAtY5AemjObNRI86NMGtlA__c_8tLil",URL="https://vzgmhdxxlgdiimqtincf.supabase.co",API=URL+"/functions/v1/mindflow-library";
const supa=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function fileFor(id,action){const {data:{session}}=await supa.auth.getSession();if(!session?.user){location.href="espace-apprenant.html?mode=login";return null}const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify({action,book_id:id})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Accès indisponible.");return d}
async function read(id){try{const d=await fileFor(id,"open");if(!d)return;$("#readerTitle").textContent=d.file_name||"Lecture MindFlow";$("#readerBody").innerHTML="";if(d.file_kind==="pdf"){const f=document.createElement("iframe");f.src=d.url;f.title=d.file_name;$("#readerBody").appendChild(f)}else{const holder=document.createElement("div");holder.style.cssText="height:100%;color:#111";$("#readerBody").appendChild(holder);if(!window.ePub)await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});await window.ePub(d.url).renderTo(holder,{width:"100%",height:"100%"}).display()}$("#reader").showModal()}catch(e){alert(e.message)}}
async function download(id){try{const d=await fileFor(id,"download");if(!d)return;const a=document.createElement("a");a.href=d.url;a.download=d.file_name||"livre";a.rel="noopener";a.click()}catch(e){alert(e.message)}}
async function load(){try{const {data:{session}}=await supa.auth.getSession();if(!session?.user){location.href="espace-apprenant.html?mode=login&next="+encodeURIComponent("ma-bibliotheque.html");return}const r=await fetch(API+"?mine=1",{headers:{apikey:KEY,Authorization:"Bearer "+session.access_token}}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Impossible de charger ta bibliothèque.");const books=d.books||[];$("#state").textContent=books.length?books.length+" livre"+(books.length>1?"s":"")+" dans ta bibliothèque":"Ta bibliothèque est encore vide.";$("#books").innerHTML=books.length?books.map(b=>'<article class="book"><div class="cover">'+(b.cover_url?'<img src="'+esc(b.cover_url)+'" alt="Couverture de '+esc(b.title)+'">':'<span>✳</span>')+'</div><h2>'+esc(b.title)+'</h2><p class="author">'+esc(b.author_name)+'</p><button type="button" data-read="'+esc(b.id)+'">Lire</button><button type="button" data-download="'+esc(b.id)+'">Télécharger</button></article>').join(""):"";$("#books").querySelectorAll("[data-read]").forEach(b=>b.addEventListener("click",()=>read(b.dataset.read)));$("#books").querySelectorAll("[data-download]").forEach(b=>b.addEventListener("click",()=>download(b.dataset.download)))}catch(e){$("#state").textContent=e.message}}
$("#close").addEventListener("click",()=>{$("#reader").close();$("#readerBody").innerHTML=""});load();
</script><script src="cookie-consent.js?v=20261026-1"></script><script src="guides-apprenant.js?v=20261030-1"></script></body></html>
