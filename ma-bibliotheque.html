<style>
.hero{padding:46px 0 14px}
.hero h1{margin:14px 0 10px;font-size:clamp(2.6rem,5.5vw,4.6rem);line-height:.98;letter-spacing:-.065em}
.hero p{max-width:620px;margin:0;color:var(--muted);font-size:1.04rem;line-height:1.75}
.muted{color:var(--muted)}
#state{margin:14px 0 4px;color:var(--muted);font-size:.92rem}

/* Reprendre la lecture */
.resume{display:flex;align-items:center;gap:clamp(18px,3vw,32px);margin:22px 0 6px;padding:18px clamp(18px,3vw,28px);border:1px solid #9ff3d13a;border-radius:24px 24px 52px 24px;background:radial-gradient(ellipse at 95% 0%,#9ff3d11f,transparent 45%),linear-gradient(135deg,#ffffff0e,#ffffff04)}
.resume[hidden]{display:none}
.resume-cover{flex:none;width:96px}
.resume-body{min-width:0;flex:1}
.resume-body h2{margin:6px 0 2px;font-size:1.4rem;line-height:1.15;letter-spacing:-.03em}
.resume-body .btn{margin-top:14px}

/* Étagère */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 22px;padding:24px 0 80px}
.grid>.empty{grid-column:1/-1}
.empty .btn{margin-top:18px}
.book{display:flex;flex-direction:column;min-width:0;padding:12px 12px 16px;border:1px solid #ffffff15;border-radius:18px 18px 34px 18px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);transition:transform .25s var(--ease),border-color .25s,background .25s}
.book:hover{transform:translateY(-5px);border-color:#9ff3d15c;background:#ffffff0d}
.book .cover{box-shadow:0 16px 36px #0006}
.book h2{margin:14px 2px 3px;font-size:1.06rem;line-height:1.22;letter-spacing:-.02em}
.author{margin:0 2px;color:var(--muted);font-size:.88rem}
.progress{height:6px;margin:12px 2px 0;border-radius:99px;background:#ffffff14;overflow:hidden}
.progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--lilac))}
.progress-label{margin:6px 2px 14px;color:var(--soft);font-size:.78rem}
.book-actions{display:grid;gap:8px;margin-top:auto}
.book-actions .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Fenêtres : lecture, fiches, quiz */
.reader{width:min(1050px,94vw);height:min(88vh,900px);max-width:none;max-height:none;padding:0;border:1px solid #ffffff25;border-radius:20px;background:#111827;color:var(--ink);box-shadow:0 30px 90px #0008}
.reader::backdrop{background:#05070bdc}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 17px;border-bottom:1px solid var(--line)}
.body{height:calc(100% - 57px);background:#fff}
.body iframe{width:100%;height:100%;border:0}
.reader h2{margin:6px 0;font-size:1.2rem}
.reader .eyebrow{margin:0}
.reader button{padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:#ffffff0d;color:var(--ink);font-weight:700;cursor:pointer}
.reader button:hover{background:#ffffff18}
.reader button[type="submit"],.reader button[data-start-quiz]{background:var(--mint);border-color:var(--mint);color:#10231d}

@media(max-width:620px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
  .book{padding:9px 9px 13px}
  .resume{flex-direction:column;align-items:flex-start;border-radius:22px 22px 40px 22px}
  .resume-cover{width:84px}
  .resume-body{width:100%}
}

function progressInfo(b){
 const p=b.reading_progress,pct=Math.round(Number(p?.progress_percent||0)),done=!!p?.completed_at||pct>=100;
