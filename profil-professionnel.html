<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil enseignant — MindFlow</title><style>
:root{color-scheme:dark;--bg:#0b0e1a;--text:#f4f6ff;--muted:#9aa6c2;--accent:#72e0dc;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#343a7540,transparent 50%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}a{color:var(--accent);text-decoration:none}.wrap{width:min(1000px,calc(100% - 28px));margin:auto}header{border-bottom:1px solid var(--line);background:#0c1120}.nav{height:64px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.4rem;font-weight:900;color:var(--text)}.logo span{color:var(--accent)}main{padding:26px 0 60px}.panel{background:linear-gradient(145deg,#151c30,#111729);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);margin-bottom:17px}.hero{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;align-items:center}.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid #72e0dc55;background:#1b2940;display:grid;place-items:center;font-size:2.3rem;font-weight:900;color:var(--accent)}.eyebrow{color:var(--accent);font-size:.72rem;font-weight:850;letter-spacing:.15em}.name{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15;letter-spacing:-.05em;margin:8px 0}.muted{color:var(--muted)}h2{margin:0 0 12px;font-size:1.2rem}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}.stat{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0d1426}.stat b{display:block;font-size:1.45rem;color:var(--accent)}.stat span{font-size:.78rem;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:9px;padding:10px 13px;font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:var(--accent);color:#0b1720;border-color:transparent}.btn.active{border-color:var(--accent);color:var(--accent)}.notice{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.hidden{display:none!important}.bio{white-space:pre-wrap}.offer{padding:15px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#0d1426}.offer h3{text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}.offer-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.price{color:var(--accent);font-weight:850}.stars{display:flex;gap:6px}.star{font-size:1.7rem;background:none;border:0;color:#68738f;cursor:pointer}.star.selected{color:#ffd477}.field{display:grid;gap:6px;margin:12px 0}.field textarea{width:100%;background:#0b1222;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:12px;font:inherit}@media(max-width:600px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{justify-content:center}}</style></head><body><header><div class="wrap nav"><a class="logo" href="index.html">Mind<span>Flow</span></a><a href="integration-classes.html">Explorer les offres ↗</a></div></header><main class="wrap"><div id="loading" class="panel">Chargement du profil…</div><div id="error" class="panel hidden"></div><div id="content" class="hidden"><section class="panel"><div class="hero"><img id="avatar" class="avatar hidden" alt="Photo de l’enseignant"><div id="fallback" class="avatar">MF</div><div><div class="eyebrow">PROFIL PROFESSIONNEL</div><h1 class="name" id="name"></h1><div id="headline"></div><p class="muted" id="country"></p><div class="actions"><button class="btn" id="follow">＋ S’abonner</button><button class="btn" id="favorite">♡ Ajouter aux favoris</button><button class="btn" id="like">♡ J’aime</button></div></div></div><div class="stats"><div class="stat"><b id="followers">0</b><span>Abonnés</span></div><div class="stat"><b id="likes">0</b><span>J’aime</span></div><div class="stat"><b id="average">—</b><span>Note moyenne / 5</span></div><div class="stat"><b id="ratingCount">0</b><span>Avis</span></div></div><div id="notice" class="notice hidden"></div></section><section class="panel"><h2>Présentation</h2><div id="bio" class="bio muted"></div></section><section class="panel"><h2>Noter cet enseignant</h2><p class="muted">Une note par apprenant ; tu peux la modifier plus tard.</p><div class="stars" id="stars"><button class="star" data-star="1">★</button><button class="star" data-star="2">★</button><button class="star" data-star="3">★</button><button class="star" data-star="4">★</button><button class="star" data-star="5">★</button></div><div class="field"><label for="review">Commentaire facultatif</label><textarea id="review" rows="3" maxlength="500"></textarea></div><button class="btn primary" id="saveRating">Envoyer ma note</button><div id="ratingNotice" class="notice hidden"></div></section><section class="panel"><h2>Offres publiées</h2><div id="offers">Chargement…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://vzgmhdxxlgdiimqtincf.supabase.co","sb_publishable_JAtY5AemjObNRI86NMGtlA__c_8tLil",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=x=>document.getElementById(x),pid=new URLSearchParams(location.search).get("id");let prof,user,stars=0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function msg(el,s){$(el).textContent=s;$(el).classList.remove("hidden")}
function paint(){document.querySelectorAll("[data-star]").forEach(b=>b.classList.toggle("selected",+b.dataset.star<=stars))}
async function stats(){const {data,error}=await db.from("professional_social_stats").select("followers_count,likes_count,ratings_count,rating_average").eq("professional_id",prof.id).maybeSingle();if(error)throw error;$("followers").textContent=data?.followers_count||0;$("likes").textContent=data?.likes_count||0;$("ratingCount").textContent=data?.ratings_count||0;$("average").textContent=data?.rating_average==null?"—":Number(data.rating_average).toFixed(1)+" ★"}
async function relation(table,btn,yes,no){if(!user){msg("notice","Connecte-toi à ton compte apprenant pour utiliser cette fonction.");return}btn.disabled=true;try{const {data,error}=await db.from(table).select("id").eq("professional_id",prof.id).eq("learner_id",user.id).maybeSingle();if(error)throw error;if(data){const q=await db.from(table).delete().eq("professional_id",prof.id).eq("learner_id",user.id);if(q.error)throw q.error;btn.textContent=no;btn.classList.remove("active")}else{const q=await db.from(table).insert({professional_id:prof.id,learner_id:user.id});if(q.error)throw q.error;btn.textContent=yes;btn.classList.add("active")}await stats()}catch(e){msg("notice",e.message||"Action impossible.")}finally{btn.disabled=false}}
async function init(){if(!pid)throw Error("Identifiant de profil manquant.");const {data,error}=await db.from("professional_profiles").select("id,display_name,headline,bio,country,avatar_url,status").eq("id",pid).eq("status","approved").maybeSingle();if(error)throw error;if(!data)throw Error("Ce profil n’est pas disponible.");prof=data;$("name").textContent=prof.display_name||"Enseignant MindFlow";$("headline").textContent=prof.headline||"";$("country").textContent=prof.country||"";$("bio").textContent=prof.bio||"Cet enseignant n’a pas encore ajouté de présentation.";$("fallback").textContent=(prof.display_name||"MF").slice(0,2).toUpperCase();if(prof.avatar_url){$("avatar").src=prof.avatar_url;$("avatar").classList.remove("hidden");$("fallback").classList.add("hidden")}const q=await db.from("professional_offers").select("id,title,description,delivery_mode,price,is_free,level,duration_minutes").eq("professional_id",pid).eq("status","published").order("created_at",{ascending:false});if(q.error)throw q.error;$("offers").innerHTML=q.data?.length?q.data.map(o=>'<article class="offer"><h3>'+esc(o.title)+'</h3><p class="muted">'+esc(o.description||"")+'</p><p class="muted">'+esc(o.delivery_mode||"")+(o.level?" · "+esc(o.level):"")+(o.duration_minutes?" · "+o.duration_minutes+" min":"")+'</p><div class="offer-foot"><span class="price">'+(o.is_free?"Gratuit":Number(o.price||0).toLocaleString("fr-FR")+" FCFA")+'</span><a class="btn primary" href="integration-classes.html">Voir l’offre ↗</a></div></article>').join(""):'<p class="muted">Aucune offre publiée pour le moment.</p>';await stats();const s=await db.auth.getSession();user=s.data.session?.user||null;if(user){for(const [t,b,y,n] of [["professional_follows",$("follow"),"✓ Abonné","＋ S’abonner"],["professional_favorites",$("favorite"),"♥ Dans mes favoris","♡ Ajouter aux favoris"],["professional_likes",$("like"),"♥ J’aime déjà","♡ J’aime"]]){const x=await db.from(t).select("id").eq("professional_id",prof.id).eq("learner_id",user.id).maybeSingle();if(x.error)throw x.error;if(x.data){b.textContent=y;b.classList.add("active")}}const rr=await db.from("professional_ratings").select("rating,review").eq("professional_id",prof.id).eq("learner_id",user.id).maybeSingle();if(rr.data){stars=rr.data.rating;$("review").value=rr.data.review||"";paint()}}}
$("follow").onclick=()=>relation("professional_follows",$("follow"),"✓ Abonné","＋ S’abonner");$("favorite").onclick=()=>relation("professional_favorites",$("favorite"),"♥ Dans mes favoris","♡ Ajouter aux favoris");$("like").onclick=()=>relation("professional_likes",$("like"),"♥ J’aime déjà","♡ J’aime");document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{stars=+b.dataset.star;paint()});$("saveRating").onclick=async()=>{if(!user){msg("ratingNotice","Connecte-toi à ton compte apprenant pour noter cet enseignant.");return}if(!stars){msg("ratingNotice","Choisis d’abord de 1 à 5 étoiles.");return}const {error}=await db.from("professional_ratings").upsert({professional_id:prof.id,learner_id:user.id,rating:stars,review:$("review").value.trim(),updated_at:new Date().toISOString()},{onConflict:"professional_id,learner_id"});if(error){msg("ratingNotice",error.message);return}msg("ratingNotice","Merci, ta note a été enregistrée.");await stats()};
(async()=>{try{const s=await db.auth.getSession();user=s.data.session?.user||null;await init();$("loading").classList.add("hidden");$("content").classList.remove("hidden")}catch(e){$("loading").classList.add("hidden");$("error").classList.remove("hidden");$("error").textContent=e.message||"Impossible de charger le profil."}})();
</script></body></html>
